name: Update Profile Quote

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-quote
  cancel-in-progress: false

jobs:
  refresh-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Tech Quote & Update README
        run: |
          curl --fail --silent --show-error --connect-timeout 5 \
            https://dummyjson.com/quotes/random \
            > quote.json

          if ! jq -e '.quote and .author' quote.json >/dev/null 2>&1; then
            echo '{"quote":"First, solve the problem. Then, write the code.","author":"John Johnson"}' > quote.json
          fi

          RAW_QUOTE=$(jq -r '.quote' quote.json)
          RAW_AUTHOR=$(jq -r '.author' quote.json)

          sed -i '/<!-- QUOTE_START -->/,/<!-- QUOTE_END -->/{//!d}' README.md
          sed -i "/<!-- QUOTE_START -->/a *\"${RAW_QUOTE}\"* — ${RAW_AUTHOR}" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated daily quote update"

          # Integrate commits added to main after checkout.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
