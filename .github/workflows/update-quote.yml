name: Update Profile Quote

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Tech Quote & Update README
        run: |
          # Fetch the quote and save it directly to a file to prevent syntax quotes breaking bash
          curl -s --connect-timeout 5 https://dummyjson.com > quote.json
          
          # Check if the file is empty or invalid; if so, create a safe fallback file
          if [ ! -s quote.json ] || ! jq . quote.json >/dev/null 2>&1; then
            echo '{"quote":"First, solve the problem. Then, write the code.","author":"John Johnson"}' > quote.json
          fi
          
          RAW_QUOTE=$(jq -r '.quote' quote.json)
          RAW_AUTHOR=$(jq -r '.author' quote.json)
          
          # Target the exact block markers in your README file
          # Deletes old text between tags and replaces it cleanly
          sed -i '/<!-- QUOTE_START -->/,/<!-- QUOTE_END -->/{//!d}' README.md
          sed -i '/<!-- QUOTE_START -->/a "*'"$RAW_QUOTE"'*" — '"$RAW_AUTHOR"'' README.md
          
          # Push the modifications back into the repository
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "Automated daily quote update" || exit 0
          git push
